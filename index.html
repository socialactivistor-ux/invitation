<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Keerthik ❤️ Monika Wedding Reception</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    background:#000;
    height:100vh;
}

/* VIDEO BACKGROUND */

.video-container{
    position:fixed;
    inset:0;
    z-index:1;
    overflow:hidden;
}

.video-container iframe{
    position:absolute;
    top:50%;
    left:50%;
    width:100vw;
    height:56.25vw; /* 16:9 ratio */
    min-height:100vh;
    min-width:177.77vh;
    transform:translate(-50%, -50%);
    pointer-events:none;
    border:none;
}

/* DARK OVERLAY */

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:2;
}

/* CONTENT */

.content{
    position:relative;
    z-index:5;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
}

.invite{
    font-size:14px;
    letter-spacing:5px;
    text-transform:uppercase;
    margin-bottom:15px;
}

h1{
    font-size:58px;
    margin-bottom:18px;
    line-height:1.2;
}

.date{
    font-size:18px;
    font-weight:300;
    margin-bottom:35px;
    max-width:700px;
    line-height:1.8;
}

/* BUTTON */

.btn{
    padding:16px 42px;
    border:none;
    border-radius:60px;
    background:white;
    color:black;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
    background:#f6d7a8;
}

/* SOUND BUTTON */

.sound-btn{
    position:absolute;
    top:25px;
    right:25px;
    z-index:10;
    background:rgba(255,255,255,0.2);
    border:1px solid rgba(255,255,255,0.4);
    color:white;
    padding:12px 20px;
    border-radius:50px;
    cursor:pointer;
    backdrop-filter:blur(10px);
}

/* MOBILE */

@media(max-width:768px){

    h1{
        font-size:34px;
    }

    .date{
        font-size:16px;
        line-height:1.6;
    }

    .btn{
        width:100%;
        max-width:320px;
    }

}

</style>
</head>

<body>

<!-- SOUND BUTTON -->
<button class="sound-btn" onclick="enableSound()">
    🔊 Enable Sound
</button>

<!-- VIDEO -->
<div class="video-container">

    <iframe
        id="youtubeVideo"
        src="https://www.youtube.com/embed/BDxF6eckwUQ?autoplay=1&mute=1&controls=0&loop=1&playlist=BDxF6eckwUQ&playsinline=1&enablejsapi=1"
        allow="autoplay"
        allowfullscreen>
    </iframe>

    <div class="overlay"></div>

</div>

<!-- CONTENT -->
<div class="content">

    <div class="invite">
        Wedding Reception Invitation
    </div>

    <h1>
        Keerthik ❤️ Monika
    </h1>

    <div class="date">
        Together with our families,<br>
        we invite you to celebrate our special day
    </div>

    <button class="btn" onclick="openInvite()">
        Open Calendar Invitation
    </button>

</div>

<script>

function openInvite(){

    window.location.href =
    "https://calendar.app.google/RoCL3fj8qG7PVg629";

}

/*
IMPORTANT:
Browsers block autoplay with sound.
User interaction is REQUIRED.
*/

function enableSound(){

    const iframe = document.getElementById("youtubeVideo");

    iframe.src =
    "https://www.youtube.com/embed/BDxF6eckwUQ?autoplay=1&mute=0&controls=0&loop=1&playlist=BDxF6eckwUQ&playsinline=1";

}

</script>

</body>
</html>
